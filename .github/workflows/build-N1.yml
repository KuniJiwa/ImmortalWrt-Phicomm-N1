# ============================================================================
# ImmortalWrt 旁路由固件自动编译发布（armsr/armv8 · N1/S905D）
# 构建：ImageBuilder 声明式构建（非 make）；打包：openwrt_packit@custom → N1 直刷 .img.gz
# 产物：.img.gz + rootfs.tar.gz 双格式，自动 Release；基于 wukongdaily/ImmortalWrt-ImageBuilder 优化
# ============================================================================

name: Build N1 ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: '选择LuCI 版本'
        required: true
        default: '24.10.6'
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6

      kernel_series:
        description: '选择内核系列'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 5.4.y
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y

      kernel_manual:
        description: '（可选）手填具体内核版本，如 6.12.108。留空 = 按上面系列自动拉最新'
        required: false
        default: ''
        type: string

      plugins:
        description: '集成插件组合'
        required: true
        default: 'Clashoo + iStore'
        type: choice
        options:
          - 'Clashoo + iStore'
          - 'Clashoo'
          - 'Clashoo + iStore + Docker'
          - 'iStore'
          - 'OpenClash + iStore'
          - 'OpenClash'
          - 'OpenClash + iStore + Docker'
          - 'None'

      aria_dufs:
        description: '附加包（包名用空格分隔，默认 aria2 + dufs，留空则不装）'
        required: false
        default: 'luci-app-aria2 aria2 luci-i18n-aria2-zh-cn luci-app-dufs luci-i18n-dufs-zh-cn'
        type: string

      rootfs_size:
        description: '软件包分区大小（MB）'
        required: true
        default: '1024'
        type: string

      builder_name:
        description: '设置打包作者的名称'
        required: true
        default: 'KuniJiwa'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve kernel version
        id: kernel
        run: |
          SERIES="${{ inputs.kernel_series }}"
          MANUAL="${{ inputs.kernel_manual }}"
          if [ -z "$MANUAL" ]; then
            echo "version=$SERIES" >> $GITHUB_OUTPUT
            echo "auto=true" >> $GITHUB_OUTPUT
            echo "✅ 未手填，使用系列 $SERIES 自动拉最新"
          else
            LIST=$(curl -sL "https://api.github.com/repos/ophub/kernel/releases/tags/kernel_flippy")

            if ! echo "$MANUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::格式错误：$MANUAL，应为 x.y.z（如 6.12.108）"
              {
                echo "## ❌ 格式错误"
                echo "手填版本：\`${MANUAL}\`"
                echo ""
                echo "应为 x.y.z，例如 6.1.163 / 6.12.108"
              } >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            if ! echo "$LIST" | grep -q "\"name\": \"${MANUAL}.tar.gz\""; then
              echo "::error::kernel_flippy 中不存在 ${MANUAL}.tar.gz"
              {
                echo "## ❌ 内核不存在"
                echo "手填版本：\`${MANUAL}\`"
                echo ""
                echo "### 当前可用版本"
                echo ""
                echo '```'
                echo "$LIST" | grep -oP '"name": "\K[^"]+\.tar\.gz' | sed 's/\.tar\.gz//'
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            echo "version=$MANUAL" >> $GITHUB_OUTPUT
            echo "auto=false" >> $GITHUB_OUTPUT
            echo "✅ 使用手填版本 $MANUAL"
          fi

      - name: Prepare environment
        run: |
          mkdir -p bin/targets/armsr/armv8/

      - name: Building N1 ImmortalWrt rootfs LuCI ${{ inputs.luci_version }} | Kernel ${{ steps.kernel.outputs.version }}
        run: |
          echo "✅ 使用 ImageBuilder 构建 rootfs"
          docker run --rm -i \
            --user root \
            -v ${{ github.workspace }}/bin:/home/build/immortalwrt/bin \
            -v ${{ github.workspace }}/files:/home/build/immortalwrt/files \
            -v ${{ github.workspace }}/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf \
            -v ${{ github.workspace }}/build.sh:/home/build/immortalwrt/build.sh \
            -v ${{ github.workspace }}/download-sources.py:/home/build/immortalwrt/download-sources.py \
            -e PROFILE=generic \
            -e PLUGINS="${{ inputs.plugins }}" \
            -e ARIA_DUFS="${{ inputs.aria_dufs }}" \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e ROOTFS_PARTSIZE=${{ inputs.rootfs_size }} \
            immortalwrt/imagebuilder:armsr-armv8-openwrt-${{ inputs.luci_version }} \
            /bin/bash -c "
              { grep '^arch ' /home/build/immortalwrt/files/etc/opkg/arch.conf; cat repositories.conf; } > /tmp/repos.conf && mv /tmp/repos.conf repositories.conf
              bash /home/build/immortalwrt/build.sh
            "

      - name: Remove redundancy
        run: python3 cleanup.py

      - name: 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -1)
          [ -f "$ROOTFS_FILE" ] || exit 1
          echo "🔍 Rootfs: $ROOTFS_FILE"
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: Setup flippy-openwrt-actions
        run: |
          git clone --depth 1 https://github.com/ophub/flippy-openwrt-actions custom
          cd custom
          git apply $GITHUB_WORKSPACE/flippy.patch

      - name: Package armsr-armv8 as ImmortalWrt for N1
        uses: ./custom
        env:
          OPENWRT_ARMVIRT: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: ${{ steps.kernel.outputs.version }}
          KERNEL_AUTO_LATEST: ${{ steps.kernel.outputs.auto }}
          WHOAMI: ${{ inputs.builder_name }}
          APPLY_CUSTOM_PATCH: 1

      - name: Rename .img.gz file
        id: rename
        run: |
          OUTPUT_DIR="${PACKAGED_OUTPUTPATH:-/opt/openwrt_packit/output}"
          IMG_FILE=$(ls ${OUTPUT_DIR}/*.img.gz | head -n1)
          KERNEL_VERSION=$(echo "$IMG_FILE" | grep -oP 'k\d+\.\d+\.\d+')
          LUCI_VERSION="${{ inputs.luci_version }}"
          TIMESTAMP=$(date +"%Y%m%d-%H%M")-${{ github.run_number }}
          mv "$IMG_FILE" "${OUTPUT_DIR}/immortalwrt-${LUCI_VERSION}-phicomm-n1-btrfs-${KERNEL_VERSION}-${TIMESTAMP}.img.gz"
          ROOTFS_FILE=$(find "${GITHUB_WORKSPACE}/bin/targets/armsr/armv8/" -type f -name "*rootfs.tar.gz" | head -n1)
          if [ -f "$ROOTFS_FILE" ]; then
            cp "$ROOTFS_FILE" "${OUTPUT_DIR}/immortalwrt-${LUCI_VERSION}-phicomm-n1-${TIMESTAMP}-rootfs.tar.gz"
          fi
          echo "release_tag=${TIMESTAMP}" >> $GITHUB_OUTPUT
          {
            echo "## 构建信息"
            echo "- LuCI 版本：${{ inputs.luci_version }}"
            echo "- 内核版本：${{ steps.kernel.outputs.version }}"
            echo "- 插件：${{ inputs.plugins }}"
            _extra="${{ inputs.aria_dufs }}"
            echo "- 附加包：${_extra:-无}"
            echo ""
            echo "## 默认参数"
            echo "- 管理密码：\`password\`（rootfs 无密码）"
            echo "- 网络模式：DHCP 自动获取（纯旁路由）"
            echo "- 本地 DHCP：默认关闭"
            echo "- WAN 入站：默认放行"
          } > "${GITHUB_WORKSPACE}/release_body.md"

      - name: Upload firmware to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rename.outputs.release_tag }}
          name: "[${{ inputs.plugins }}] ImmortalWrt N1"
          body_path: ${{ github.workspace }}/release_body.md
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-*.img.gz
            ${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-*-rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
